<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic DOM Manipulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Welcome to Dynamic DOM Manipulation</h1>
  </header>

  <main>
    <p id="message">This is some text that will change.</p>

    <button id="changeTextBtn">Change Text</button>
    <button id="changeStyleBtn">Change Style</button>
    <button id="addElementBtn">Add New Element</button>
    <button id="removeElementBtn">Remove Element</button>
    
    <div id="dynamicElementsContainer">
      <!-- New elements will be added here -->
    </div>
  </main>

  <footer>
    <p>© 2025 My Dynamic Page</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
